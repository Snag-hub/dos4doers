<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline — DOs 4 DOERs</title>
<style>
    :root {
        color-scheme: light dark;
        --bg: #fafafa;
        --fg: #18181b;
        --muted: #71717a;
        --border: #e4e4e7;
        --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #09090b;
            --fg: #f4f4f5;
            --muted: #a1a1aa;
            --border: #27272a;
            --accent: #60a5fa;
        }
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        line-height: 1.6;
    }
    .banner {
        border-bottom: 1px solid var(--border);
        padding: 10px 16px;
        font-size: 13px;
        color: var(--muted);
        text-align: center;
    }
    header {
        border-bottom: 1px solid var(--border);
        padding: 12px 16px;
    }
    header a {
        color: var(--muted);
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
    }
    article {
        max-width: 720px;
        margin: 0 auto;
        padding: 32px 16px 64px;
    }
    .site {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--accent);
        margin-bottom: 16px;
    }
    .site img { width: 16px; height: 16px; border-radius: 3px; }
    h1 { font-size: 2rem; font-weight: 800; margin: 0 0 16px; }
    .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 32px;
    }
    .content img { max-width: 100%; border-radius: 12px; }
    .content a { color: var(--accent); }
    .empty {
        max-width: 480px;
        margin: 20vh auto 0;
        padding: 0 16px;
        text-align: center;
    }
    .empty a { color: var(--accent); }
</style>
</head>
<body>
<div class="banner">You're offline — showing the saved copy of this article.</div>
<header><a href="/">&larr; Back to Inbox</a></header>
<div id="root"></div>
<script>
(function () {
    var DB_NAME = 'dos4doers-offline';
    var DB_VERSION = 1;
    var STORE_NAME = 'items';

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    function getItemId() {
        var m = location.pathname.match(/^\/reader\/([^/]+)\/?$/);
        return m ? decodeURIComponent(m[1]) : null;
    }

    function openDb() {
        return new Promise(function (resolve, reject) {
            var req = indexedDB.open(DB_NAME, DB_VERSION);
            req.onupgradeneeded = function () {
                if (!req.result.objectStoreNames.contains(STORE_NAME)) {
                    req.result.createObjectStore(STORE_NAME, { keyPath: 'id' });
                }
            };
            req.onsuccess = function () { resolve(req.result); };
            req.onerror = function () { reject(req.error); };
        });
    }

    function getRecord(id) {
        return openDb().then(function (db) {
            return new Promise(function (resolve, reject) {
                var tx = db.transaction(STORE_NAME, 'readonly');
                var req = tx.objectStore(STORE_NAME).get(id);
                req.onsuccess = function () { resolve(req.result); };
                req.onerror = function () { reject(req.error); };
            });
        });
    }

    function renderEmpty() {
        document.getElementById('root').innerHTML =
            '<div class="empty">' +
            '<h1 style="font-size:1.25rem;">This article wasn\'t saved for offline reading</h1>' +
            '<p style="color:var(--muted);">Open it again once you\'re back online, or ' +
            '<a href="/">return to your inbox</a>.</p>' +
            '</div>';
    }

    function renderArticle(record) {
        var siteRow = record.siteName
            ? '<div class="site">' +
              (record.favicon ? '<img src="' + escapeHtml(record.favicon) + '" alt="" />' : '') +
              escapeHtml(record.siteName) + '</div>'
            : '';

        var date = record.createdAt ? new Date(record.createdAt).toLocaleDateString(undefined, {
            year: 'numeric', month: 'long', day: 'numeric'
        }) : '';

        document.getElementById('root').innerHTML =
            '<article>' +
            siteRow +
            '<h1>' + escapeHtml(record.title || record.url) + '</h1>' +
            '<div class="meta">' +
            (record.author ? '<span>' + escapeHtml(record.author) + '</span>' : '') +
            (date ? '<span>' + date + '</span>' : '') +
            '</div>' +
            '<div class="content">' + record.content + '</div>' +
            '</article>';
    }

    var itemId = getItemId();
    if (!itemId) {
        renderEmpty();
    } else {
        getRecord(itemId).then(function (record) {
            if (record) renderArticle(record);
            else renderEmpty();
        }).catch(renderEmpty);
    }
})();
</script>
</body>
</html>
